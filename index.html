<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B.L.A.S.T. - Local Test Generator</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fira+Code:wght@400&display=swap" rel="stylesheet">
    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
    <!-- Markdown Parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

    <div class="chat-container">
        <!-- Header -->
        <div class="chat-header">
            <div class="status-indicator" title="Connected to Local Ollama"></div>
            <h1>Ai Test Generator (Llama 3.2)</h1>
        </div>

        <!-- Messages Log -->
        <div id="chat-messages" class="chat-messages">
            <!-- Welcome Message -->
            <div class="message ai">
                <strong>System Pilot:</strong><br>
                Hello! I am ready to generate test cases for you. Describe your feature or paste your code below.
            </div>
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <textarea id="user-input" placeholder="Describe the feature or paste code here..." autofocus rows="1"></textarea>
            <button id="send-btn">
                <span>Generate</span>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>
    </div>

    <!-- Application Logic -->
    <script src="app.js"></script>

</body>
</html>
